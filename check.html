<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Parang Readiness Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sticky app bar; views: Assessments, 4-step workspace (Business, Frameworks, Practices, Report), Framework library, Consultant desk; auditor's-ledger rows, IDs in mono */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D3D9D2;
  --fg:#18211D; --muted:#5A6760; --accent:#1D6A5A; --accent-soft:#DCEBE5; --on-accent:#FFFFFF;
  --good:#2F7A4B; --good-soft:#DDEFE2; --warn:#A8690F; --warn-soft:#F6E8CF; --bad:#B03A33; --bad-soft:#F6DEDA; --na:#7C8680; --na-soft:#E6E9E5;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201D; --sunk:#1F2925; --line:#2E3A35;
  --fg:#E4EBE7; --muted:#9AA8A1; --accent:#5FC0A6; --accent-soft:#1B3A33; --on-accent:#0D1714;
  --good:#6CC58F; --good-soft:#1C3527; --warn:#E3AA52; --warn-soft:#3A2D16; --bad:#EE8078; --bad-soft:#3E211E; --na:#8E9993; --na-soft:#262E2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201D; --sunk:#1F2925; --line:#2E3A35;
  --fg:#E4EBE7; --muted:#9AA8A1; --accent:#5FC0A6; --accent-soft:#1B3A33; --on-accent:#0D1714;
  --good:#6CC58F; --good-soft:#1C3527; --warn:#E3AA52; --warn-soft:#3A2D16; --bad:#EE8078; --bad-soft:#3E211E; --na:#8E9993; --na-soft:#262E2B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.mono{font-family:var(--f-mono);font-size:.85em}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.meta{font-size:.85rem;color:var(--muted)}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1000px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:800 1.05rem var(--f-display);font-stretch:80%;letter-spacing:.01em;background:none;border:0;color:var(--fg);cursor:pointer;padding:0}
.brand svg{flex:none}
.brand small{font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-stretch:100%}
.appnav{display:flex;gap:4px;margin-left:auto}
.appnav button{font:600 .92rem var(--f-body);background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:var(--r);cursor:pointer}
.appnav button[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.savestate{font:500 .75rem var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--na))}
@media (max-width:560px){.brand small{display:none}.savestate{order:3;width:100%;padding-bottom:8px}.appbar .in{gap:8px}}

button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:700 .95rem var(--f-body);border-radius:var(--r);padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--fg)}
.linkbtn{background:none;border:0;color:var(--accent);font:600 .9rem var(--f-body);cursor:pointer;padding:4px 0}

/* Home */
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.pagehead p{margin:4px 0 0;max-width:60ch;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .who strong{overflow-wrap:anywhere}
.mini{display:flex;flex-direction:column;gap:4px}
.mini .track{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.mini .track i{display:block;height:100%;background:var(--accent)}
.mini span{font:600 .85rem var(--f-body);font-variant-numeric:tabular-nums}
.tag{font:600 .7rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.rowact{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:var(--r);padding:8px 10px;font-size:.93rem}
.empty{padding:22px 16px;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) auto}.row .hi{display:none}.row .mini{grid-column:1/-1;grid-row:2}}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:22px}
.how div{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.how b{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}

/* Workspace */
.wshead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.crumb{display:flex;gap:8px;align-items:center}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:.93rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.steps button{font:600 .95rem var(--f-body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:9px 6px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.steps button .n{font-family:var(--f-mono);font-size:.8rem}
.steps button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.progress{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.progress .track{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--accent)}
.panel{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .lbl{font-weight:700}
.q .help{font-size:.9rem;color:var(--muted);margin-top:-6px}
input[type=text],input[type=search],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px}
label.opt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--bg);font-size:.95rem;user-select:none}
label.opt input{accent-color:var(--accent);margin:0}
label.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:4px}
.cid{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);color:var(--muted);border-radius:4px;padding:1px 6px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri label{display:flex;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;cursor:pointer;font-weight:600;font-size:.93rem;background:var(--bg)}
.tri input{position:absolute;opacity:0;pointer-events:none}
.tri label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tri label.y:has(input:checked){background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tri label.p:has(input:checked){background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tri label.x:has(input:checked){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* Report */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:.85rem;color:var(--muted)}
.tile.lead{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tile.lead .k{color:var(--on-accent);opacity:.85}
.exports{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,160px) 1fr 52px;gap:10px;align-items:center;font-size:.93rem}
.bar .track{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.gap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.gap:first-of-type{border-top:0;padding-top:0}
.gap .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.pill{font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 7px;white-space:nowrap;align-self:start}
.pill.High,.pill.No{background:var(--bad-soft);color:var(--bad)}
.pill.Medium,.pill.Partly{background:var(--warn-soft);color:var(--warn)}
.pill.Low,.pill.Yes{background:var(--good-soft);color:var(--good)}
.pill.Excluded{background:var(--na-soft);color:var(--na)}
.clauses{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.clause{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--bg);border-radius:var(--r);font-size:.93rem}
.clause .mono{color:var(--muted);min-width:3.2em}
.clause .t{flex:1;min-width:0}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.phase{border-top:3px solid var(--accent);background:var(--bg);border-radius:0 0 var(--r) var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.phase ul{margin:0;padding-left:18px;font-size:.9rem}
.phase .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.scope{background:var(--bg);border-left:3px solid var(--accent);padding:10px 14px;margin:0;max-width:72ch}
.oblig{display:flex;flex-direction:column}
.oblig div{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}
.oblig div:first-child{border-top:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
td.id{font-family:var(--f-mono);white-space:nowrap;font-size:.82rem}
td .why{display:block;font-size:.82rem;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.toast{font-size:.85rem;color:var(--good)}
.toast.err{color:var(--bad)}
.libtools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
@media (max-width:520px){.bar{grid-template-columns:1fr 46px}.bar .name{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){#view>*{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}

/* Prospect call to action and forms */
.cta{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:18px}
.cta-text{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cta-text p{margin:0;max-width:66ch}
.cta-act{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-weight:700;font-size:.93rem}
input[type=email],input[type=tel],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%}
textarea{resize:vertical}
textarea:focus-visible,input[type=email]:focus-visible,input[type=tel]:focus-visible,input[type=number]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.consent input{accent-color:var(--accent);margin-top:4px;flex:none}
.ferr{color:var(--bad);margin:0;font-size:.93rem;min-height:0}
.ferr:empty{display:none}
.sel{user-select:all;font-weight:600}
textarea.code{font-family:var(--f-mono);font-size:.8rem;word-break:break-all}
.btn:disabled{opacity:.6;cursor:wait}
/* Consultant desk and brief */
.pill.T-Hot{background:var(--bad-soft);color:var(--bad)}
.pill.T-Warm{background:var(--warn-soft);color:var(--warn)}
.pill.T-Cool{background:var(--na-soft);color:var(--na)}
.pill.big{font-size:.85rem;padding:5px 10px}
.briefhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.briefhead>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.talk{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.talk:first-of-type{border-top:0;padding-top:0}
.talk ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.obj{margin:0;display:grid;gap:4px}
.obj dt{font-weight:700}
.obj dd{margin:0 0 8px;color:var(--muted)}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
th.num,td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--accent-soft)}
tr.sub td{color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:0}.kv dd{margin-bottom:8px}}

/* Multi-framework */
.steps.four{grid-template-columns:repeat(4,1fr)}
.steps.two{grid-template-columns:repeat(2,1fr);max-width:460px}
@media (max-width:520px){.steps.four button{font-size:.85rem;padding:9px 2px}.steps.four .n{display:none}}
.secHead{grid-column:1/-1;font-size:1.05rem;margin-top:8px;display:flex;gap:8px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fwchip{font:600 .72rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill.L-required,.pill.L-requested{background:var(--bad-soft);color:var(--bad)}
.pill.L-recommended{background:var(--accent-soft);color:var(--accent)}
.pill.L-optional{background:var(--na-soft);color:var(--na)}
.summarybar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fwfam{display:flex;flex-direction:column;gap:10px}
.fwfam h2{font-size:1.05rem}
.fwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fwcard{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 42px;cursor:pointer;min-width:0}
.fwcard input{position:absolute;left:14px;top:15px;accent-color:var(--accent);width:17px;height:17px;margin:0}
.fwcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fwcard:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fwtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
ul.why{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0;scrollbar-width:thin}
.tabs button{font:600 .9rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fwhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.fwhead>div{display:flex;flex-direction:column;gap:4px;min-width:0}
h2.big{font-size:clamp(1.3rem,3.5vw,1.7rem)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.libcard h2{font-size:1.2rem}
.kv.small{font-size:.88rem;gap:4px 14px}
.tile .v{overflow-wrap:anywhere}
.row .mini span:first-child::after{content:" ready";font-weight:400;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;padding:10px 0}
details.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Entry paths and expectations */
.pathgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.pathcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;font:inherit;color:inherit}
.pathcard:hover{border-color:var(--accent)}
.pathcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ptitle{font-family:var(--f-display);font-stretch:85%;font-size:1.25rem;line-height:1.2;text-wrap:balance}
.pdesc{color:var(--muted);font-size:.95rem}
.pgo{margin-top:auto;font-weight:700;color:var(--accent)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
.note{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-radius:var(--r);padding:10px 12px;font-size:.93rem;background:var(--sunk)}
.note.ok{background:var(--good-soft)}
.note.warn{background:var(--warn-soft)}
.intro{gap:8px}
.q.wide{grid-column:1/-1}
.askfam{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.tier{display:flex;flex-direction:column;gap:10px}
.tierhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tierhead h2{font-size:1.2rem}
.plancard{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 42px;cursor:pointer;min-width:0}
.plancard input{position:absolute;left:14px;top:15px;accent-color:var(--accent);width:17px;height:17px;margin:0}
.plancard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plancard:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.facts b{color:var(--fg);font-variant-numeric:tabular-nums}
.feas{font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 7px;white-space:nowrap}
.feas.F-ok{background:var(--good-soft);color:var(--good)}
.feas.F-tight{background:var(--warn-soft);color:var(--warn)}
.feas.F-no{background:var(--bad-soft);color:var(--bad)}
.feas.F-none{background:var(--na-soft);color:var(--na)}
.feasrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.feasrow:first-of-type{border-top:0;padding-top:0}
.fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.journey{display:flex;flex-direction:column;gap:10px}
.jlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.jlist li span{display:block}
.flowsteps{margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.flowsteps li{display:flex;flex-direction:column;gap:2px}
.grid2.tight{gap:16px}
.grid2.tight h3{margin-bottom:6px}
.crumb .meta{margin:0 2px}
@media (max-width:560px){.steps button .n{display:none}.steps button{font-size:.82rem;padding:9px 2px}}
.appnav a.navhome{font:600 .92rem var(--f-body);color:var(--muted);padding:8px 10px;border-radius:var(--r);text-decoration:none}
.appnav a.navhome:hover{color:var(--fg);background:var(--sunk)}
.appnav a.navhome:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Parang brand and icon set */
:root{--blue:#2D6BD2;--blue-s:#E4EDFC;--purple:#7650CC;--purple-s:#EEE8FB;--orange:#CF7A22;--orange-s:#FCEBD8;--teal:#1A8AA0;--teal-s:#DCF1F5;--indigo:#4952C4;--indigo-s:#E6E7FA;--green:#2C8650;--green-s:#DEF1E4;--rose:#C8425A;--rose-s:#FAE3E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#7FA9F2;--blue-s:#1B2A44;--purple:#B39AF0;--purple-s:#2A2240;--orange:#F0A75C;--orange-s:#3A2A18;--teal:#6CC9DB;--teal-s:#173238;--indigo:#9AA1F2;--indigo-s:#22254A;--green:#74CE96;--green-s:#1A3324;--rose:#F08B9E;--rose-s:#3E1F27}}
:root[data-theme="dark"]{--blue:#7FA9F2;--blue-s:#1B2A44;--purple:#B39AF0;--purple-s:#2A2240;--orange:#F0A75C;--orange-s:#3A2A18;--teal:#6CC9DB;--teal-s:#173238;--indigo:#9AA1F2;--indigo-s:#22254A;--green:#74CE96;--green-s:#1A3324;--rose:#F08B9E;--rose-s:#3E1F27}
.logo{width:30px;height:30px;flex:none;border-radius:8px;box-shadow:0 1px 2px rgba(16,40,34,.2)}
.brand{font-size:1.15rem}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.tile{width:40px;height:40px;border-radius:11px;display:inline-grid;place-items:center;flex:none;background:var(--ts);color:var(--tc)}
.tile.lg{width:48px;height:48px;border-radius:13px}
.tile.lg .ic{width:27px;height:27px}
.tile.sm{width:22px;height:22px;border-radius:6px}
.tile.sm .ic{width:15px;height:15px}
.c-blue{--tc:var(--blue);--ts:var(--blue-s)}.c-purple{--tc:var(--purple);--ts:var(--purple-s)}.c-orange{--tc:var(--orange);--ts:var(--orange-s)}
.c-teal{--tc:var(--teal);--ts:var(--teal-s)}.c-indigo{--tc:var(--indigo);--ts:var(--indigo-s)}.c-green{--tc:var(--green);--ts:var(--green-s)}.c-rose{--tc:var(--rose);--ts:var(--rose-s)}
.famh{display:flex;align-items:center;gap:10px}
.famh .tile{width:30px;height:30px;border-radius:8px}
.famh .tile .ic{width:18px;height:18px}
.how .tile{margin-bottom:6px}
.pathcard .tile{margin-bottom:4px}
.libtop{display:flex;gap:12px;align-items:flex-start}
.routeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.appnav{flex-wrap:wrap;gap:0;margin-left:0;width:100%}.appnav button,.appnav a.navhome{padding:6px 8px;font-size:.88rem}}
</style>

function applicability(id,p){
  const dev=p.dev,noPrem=p.work==="remote"&&p.hosting==="cloud";
  if(dev==="none"&&DEV_CTL.includes(id))return{app:false,why:"No software development in scope."};
  if(dev==="inhouse"&&id==="8.30")return{app:false,why:"All development is done in-house."};
  if(dev==="outsourced"&&id==="8.4")return{app:true,why:"Applies to source code held by your developer."};
  if(noPrem&&PREM_CTL.includes(id))return{app:false,why:"No company premises or servers. Physical security sits with the cloud provider; keep their certificates on file."};
  if(p.hosting==="cloud"&&id==="7.6")return{app:false,why:"No server room or secure area under company control."};
  if(p.work==="office"&&id==="6.7")return{app:false,why:"Remote working is not permitted."};
  if(id==="8.11"&&dev==="none"&&!(p.data||[]).length)return{app:false,why:"No personal or sensitive data used for testing or analytics."};
  if(id==="8.26"&&dev==="none")return{app:true,why:"Applies to software and SaaS you buy."};
  return{app:true,why:""};
}
const EXCLUDABLE={"6.7":"Staff never work remotely","7.6":"Systems are cloud-only","8.11":"No development and no personal data","8.30":"All development is in-house"};
DEV_CTL.forEach(c=>{if(!EXCLUDABLE[c])EXCLUDABLE[c]="No software development"});

function statusOf(id,a){let pid=PRACTICE_OF[id];if(pid==="P18"&&a.profile.dev==="none")pid="P5";return a.answers[pid]||"no"}
function iso27(a){
  const p=a.profile;
  const rows=CONTROLS.map(([id,name])=>{const ap=applicability(id,p);const st=ap.app?statusOf(id,a):"excluded";return{id,name,theme:THEMES[id.split(".")[0]],app:ap.app,why:ap.why,st}});
  const app=rows.filter(r=>r.app);
  const score=app.reduce((s,r)=>s+(r.st==="yes"?1:r.st==="partly"?.5:0),0);
  const themes=Object.values(THEMES).map(t=>{const tr=app.filter(r=>r.theme===t);const y=tr.filter(r=>r.st==="yes").length,pa=tr.filter(r=>r.st==="partly").length;return{n:t,count:tr.length,y,pa,no:tr.length-y-pa,pct:tr.length?Math.round((y+pa*.5)/tr.length*100):0}});
  return{rows,app,readiness:app.length?Math.round(score/app.length*100):0,themes};
}

const isMust=l=>l==="required"||l==="requested";
function practiceIds(a){const ids=new Set();selected(a).forEach(f=>fwPractices(f,a.profile).forEach(id=>ids.add(id)));return PRACTICES.filter(x=>ids.has(x.id)).map(x=>x.id)}
function boost(id,p){
  const sens=(p.data||[]).some(d=>SENSITIVE.includes(d));let b=0;
  if(sens&&["P4","P8","P12","P20","Q3","H1"].includes(id))b++;
  if((p.suppliers==="many"||p.it==="msp")&&id==="P5")b++;
  if((p.dev==="inhouse"||p.dev==="both")&&id==="P18")b++;
  if(p.hosting!=="cloud"&&["P7","P15"].includes(id))b++;
  if(p.it==="none"&&["P2","P13"].includes(id))b++;
  if(p.availability==="critical"&&["R1","R3","R4"].includes(id))b++;
  if(p.esgAsk==="required"&&["E4","E12"].includes(id))b++;

}
function gapOf(id,a,reqIds){
  const x=P_BY_ID[id],p=a.profile,si=sizeIx(p),st=a.answers[id]||"no";
  let s=(x.w+boost(id,p))*(st==="no"?1:.6);if(reqIds&&reqIds.has(id))s+=.6;
  const days=Math.max(1,Math.round(GAP_DAYS[x.e]*(st==="no"?1:.5)*SIZE_F[si]*2)/2);
  const fws=selected(a).filter(f=>fwPractices(f,p).includes(id)).map(f=>f.id);
  return{...x,st,sc:s,pr:s>=2.4?"High":s>=1.5?"Medium":"Low",days,fws};
}
function toolCost(g,p){const t=TOOLS[g.id];if(!t)return null;const si=sizeIx(p);const[lo,hi]=t.f(HEAD[si],SCALE[si]);const k=g.st==="no"?1:.5;return{id:g.id,label:t.label,lo:lo*k,hi:hi*k}}
function fwResult(f,a){
  const p=a.profile,si=sizeIx(p),rate=Number(cfg.rate)||1200;
  const ids=fwPractices(f,p);
  const doms=f.domains.map(d=>{const ps=d.ps.filter(id=>ids.includes(id));const y=ps.filter(id=>a.answers[id]==="yes").length,pa=ps.filter(id=>a.answers[id]==="partly").length;return{n:d.n,ps,count:ps.length,y,pa,no:ps.length-y-pa,pct:ps.length?Math.round(ps.reduce((s,id)=>s+val(a.answers[id]),0)/ps.length*100):0}}).filter(d=>d.count);
  let readiness=ids.length?Math.round(ids.reduce((s,id)=>s+val(a.answers[id]),0)/ids.length*100):0;

  const sizeAdd=[0,0,1,2,3][si];

  const days=Math.round((f.base[si]+gaps.reduce((s,g)=>s+g.days*depth(f),0))*2)/2;

  const recur=f.recur?f.recur(si,p):null;

}
function portfolio(a){
  const p=a.profile,rate=Number(cfg.rate)||1200;

  const ids=practiceIds(a);
  const reqIds=new Set();res.filter(r=>isMust(r.level)).forEach(r=>r.ids.forEach(id=>reqIds.add(id)));
  const gaps=ids.filter(id=>(a.answers[id]||"no")!=="yes").map(id=>gapOf(id,a,reqIds)).sort((x,y)=>y.sc-x.sc);
  const baseDays=res.reduce((s,r)=>s+r.f.base[sizeIx(p)],0);
  const days=Math.round((baseDays+gaps.reduce((s,g)=>s+g.days*Math.max(...g.fws.map(id=>depth(FW_BY_ID[id]))),0))*2)/2;
  const standalone=res.reduce((s,r)=>s+r.days,0);

  const ext={lo:res.reduce((s,r)=>s+(r.ext?r.ext.lo:0),0),hi:res.reduce((s,r)=>s+(r.ext?r.ext.hi:0),0)};
  const tools=gaps.map(g=>toolCost(g,p)).filter(Boolean);
  const toolSum={lo:tools.reduce((s,t)=>s+t.lo,0),hi:tools.reduce((s,t)=>s+t.hi,0)};
  const year1={lo:consult.lo+ext.lo+toolSum.lo,hi:consult.hi+ext.hi+toolSum.hi};
  const ms=res.map(r=>r.months).sort((x,y)=>y-x);
  const months=ms.length?Math.min(24,Math.round(ms[0]+ms.slice(1).reduce((s,m)=>s+m,0)*.25)):0;
  const readiness=ids.length?Math.round(ids.reduce((s,id)=>s+val(a.answers[id]),0)/ids.length*100):0;
  const shared=ids.filter(id=>res.filter(r=>r.ids.includes(id)).length>1);
  return{res,ids,gaps,days,baseDays,standalone,saved:Math.max(0,standalone-days),consult,ext,tools,toolSum,year1,months,readiness,shared,rate,clientDays:Math.round(days*1.5),answered:ids.filter(id=>a.answers[id]).length};
}
function waves(pf){
  const names={1:"Must-haves: legal, contract and requested",2:"Quick wins and baselines",3:"Core certifications",4:"Add-on management systems"};
  const out=[];[1,2,3,4].forEach(w=>{const rs=pf.res.filter(r=>(isMust(r.level)&&r.f.wave>1?1:r.f.wave)===w);if(rs.length)out.push({w,name:names[w],rs})});

}

function feas(f,months,dl){
  if(dl===Infinity)return{st:"none",txt:"No fixed deadline"};

  if(need<=dl)return{st:"ok",txt:`Fits: about ${need} months needed, ${dl} available`};
  if(need<=dl*1.5)return{st:"tight",txt:`Tight: about ${need} months needed, ${dl} available`};

const FEAS_LABEL={ok:"Fits",tight:"Tight",no:"Won't fit",none:"No deadline"};
function goalMatches(a,f){return (a.intake.goals||[]).filter(g=>(GOAL_FW[g]||[]).includes(f.id)).length}

function planTiers(a){
  const p=a.profile,pre=effA(a,true),B=budgetMax(a.intake.budget),goals=a.intake.goals||[];
  const cands=FRAMEWORKS.map(f=>{const s=f.screen(p)||{};const gm=goalMatches(a,f);let lvl=s.lvl||null;if(!lvl&&gm)lvl="optional";

    const r=fwResult(f,{...pre,fw:[f.id]});const cost=(r.fees.lo+r.fees.hi)/2+(r.ext?(r.ext.lo+r.ext.hi)/2:0);
    const score={required:100,recommended:30,optional:10}[lvl]+gm*15+(f.months[0]<=2?10:0)+(FOUNDATION.includes(f.id)?8:0)-cost/5000;
    return{f,lvl,why:s.why||[],gm,r,cost,score}}).filter(Boolean).sort((x,y)=>y.score-x.score);
  const start=[],used=new Set();let spend=0;

    if(c)take(c);

const PURPOSE={"Technology / SaaS":"develop, host and support its software services","Financial services":"deliver its financial products and services","Healthcare":"provide healthcare services and manage patient information","Education":"deliver education services and manage student information","Logistics":"plan, track and deliver freight and logistics services","Retail / F&B":"run its retail and food operations, including online orders and payments","Hospitality":"run its hospitality operations and guest services","Professional services":"deliver advisory and professional services to clients","Manufacturing":"design, produce and ship its products","Construction / Real estate":"deliver its construction and property services","Government vendor":"deliver contracted services to government agencies"};
function scopeText(p){

  const dev=p.dev==="none"?"":p.dev==="inhouse"?", and the in-house software development process":p.dev==="outsourced"?", and the management of outsourced software development":", and in-house and outsourced software development";
  return `The information security management system of ${esc(p.name||"the company")} covers the people, processes and information used to ${PURPOSE[p.industry]||"deliver its services"}. It covers ${loc}, ${host}${dev}, in line with the Statement of Applicability.`;
}
const CLAUSES=[["4.3","ISMS scope defined and approved",()=>"partly","Draft below; needs management sign-off"],["5.2","Information security policy",a=>a.answers.P1],["5.3","Roles, responsibilities and authorities",a=>a.answers.P2],["6.1.2","Risk assessment",a=>a.answers.P21],["6.1.3","Statement of Applicability",()=>"partly","Draft generated below; needs review"],["6.2","Security objectives and plans",a=>a.answers.P1==="yes"&&a.answers.P21==="yes"?"yes":"partly"],["7.2–7.3","Competence and awareness",a=>a.answers.P11],["9.2","Internal audit",a=>a.answers.P9],["9.3","Management review",a=>a.answers.P21==="yes"?"partly":"no"],["10.2","Nonconformity and corrective action",a=>a.answers.P9==="yes"?"partly":"no"]];
function obligations(a){
  const p=a.profile,o=[],d=p.data||[],certs=p.certs||[],sel=new Set(a.fw||[]);
  if(d.some(x=>["pii","nric","health","children","fin"].includes(x))||has(p,"customers","consumers"))o.push(["PDPA (Singapore)","You handle personal data: you need a DPO, consent and purpose rules, and must notify PDPC of notifiable breaches within 3 calendar days of assessing them."]);
  if(d.includes("nric"))o.push(["PDPC NRIC advisory","Collect NRIC numbers only where law requires it or identity must be verified to a high degree."]);
  if(p.payments==="direct"||d.includes("card"))o.push(["PCI DSS","Handling card data brings PCI DSS into scope through your acquirer and card scheme rules."]);
  if(has(p,"markets","eu"))o.push(["EU GDPR","Applies when you offer goods or services to people in the EU or monitor them, even from Singapore."]);
  if(has(p,"regulated","mas"))o.push(["MAS technology risk","Notify MAS within 1 hour of discovering a relevant incident and send a root-cause report within 14 days. Critical systems should have no more than 4 hours of unscheduled downtime in 12 months."]);
  if(has(p,"regulated","moh"))o.push(["Healthcare Services Act","Licensed healthcare providers have cybersecurity and data requirements under the HCSA."]);
  if(!certs.includes("ct")&&isGov(p))o.push(["CSA Cyber Trust mark","Increasingly asked for in government tenders; ISO 27001 work covers most of it."]);
  if(!certs.includes("ce")&&!certs.includes("ct"))o.push(["CSA Cyber Essentials mark","Entry-level mark for SMEs. Eligible SMEs can get up to 70% co-funding for cyber consultancy through CSA's CISO-as-a-Service scheme."]);
  if(p.status==="listed")o.push(["SGX climate reporting","Scope 1 and 2 mandatory from FY2025; Scope 3 from FY2026 for STI constituents. Other ISSB disclosures from FY2025 (STI), FY2028 (S$1 billion market cap and above) or FY2030 (others). External limited assurance from FY2029."]);
  if(p.status==="sub")o.push(["Group climate reporting","Listed and large groups report under ISSB-based rules and will ask subsidiaries and suppliers for Scope 1–3 data."]);
  if(has(p,"footprint","euexport"))o.push(["EU CBAM","The definitive period began on 1 January 2026. EU importers of cement, iron and steel, aluminium, fertilisers, hydrogen and electricity must report embedded emissions, so they will ask you for data."]);
  if(has(p,"footprint","energy"))o.push(["Energy Conservation Act","Businesses using 54 TJ of energy a year or more must register with NEA, appoint an energy manager and report energy use and improvement plans."]);
  if(has(p,"footprint","energy")||has(p,"footprint","factory"))o.push(["Carbon tax","Applies to facilities emitting 25,000 tCO2e a year or more, at S$45 per tonne for 2026–2027. Large customers may pass costs and data requests down to you."]);
  if(["Manufacturing","Retail / F&B"].includes(p.industry)||has(p,"footprint","factory"))o.push(["NEA mandatory packaging reporting","Producers of packaged goods, importers and retailers with turnover above S$10 million must report packaging data and reduction plans."]);
  return o;
}
function roadmap27(r){
  const g=r.gaps,M=r.months;
  const foundation=g.filter(x=>["P1","P21","P2","P3"].includes(x.id));
  const high=g.filter(x=>x.pr==="High"&&!foundation.includes(x)&&x.id!=="P9");
  const rest=g.filter(x=>!foundation.includes(x)&&!high.includes(x)&&x.id!=="P9");
  const a=Math.max(1,Math.round(M*.2)),b=Math.max(a+1,Math.round(M*.55)),c=Math.max(b+1,M-2);
  const li=l=>l.length?l.map(x=>`<li>${esc(short(x.q))}</li>`).join(""):"<li>Already in place</li>";
  return [["Set up the ISMS",`Months 1–${a}`,li(foundation)+"<li>Approve scope and Statement of Applicability</li>"],
    ["Close high-priority gaps",`Months ${a+1}–${b}`,li(high)],
    ["Close remaining gaps, build evidence",`Months ${b+1}–${c}`,li(rest)+"<li>Run controls for at least 3 months so records exist</li>"],
    ["Audit",`Months ${c+1}–${M}`,"<li>Internal audit and management review</li><li>Stage 1 audit (documents)</li><li>Stage 2 audit (evidence) and certificate</li>"]];
}

const b64e=s=>{const bytes=new TextEncoder().encode(s);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64d=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))};
const V1_ORDER=["P1","P21","P2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12","P13","P14","P15","P16","P17","P18","P19","P20"];
function encodeLead(l){return "ISO27-"+b64e(JSON.stringify({v:3,id:l.id,t:l.submitted,p:l.profile,f:l.fw,h:l.path,i:l.intake,k:l.skipCheck?1:0,a:PRACTICES.map(x=>({yes:"y",partly:"p",no:"n"})[l.answers[x.id]]||"-").join(""),c:l.contact}))}
function decodeLead(code){
  const m=String(code).match(/ISO27-([A-Za-z0-9_-]+)/);if(!m)throw new Error("No reference code found. It starts with ISO27-.");
  let o;try{o=JSON.parse(b64d(m[1]))}catch(e){throw new Error("This code is incomplete or damaged. Ask the client to copy the whole message again.")}
  if(!o||![1,2,3].includes(o.v))throw new Error("This code isn't from this readiness check.");
  const answers={};let profile,fw;
  if(o.v===1){const k=["name","industry","size","work","hosting","dev","data","it","suppliers","certs","driver"];profile={};k.forEach((x,i)=>profile[x]=o.p[i]);V1_ORDER.forEach((id,i)=>{const c=(o.a||"")[i];if(c&&c!=="-")answers[id]={y:"yes",p:"partly",n:"no"}[c]});fw=["iso27001"]}
  else{profile=o.p||{};fw=Array.isArray(o.f)?o.f.filter(id=>FW_BY_ID[id]):[];PRACTICES.forEach((x,i)=>{const c=(o.a||"")[i];if(c&&c!=="-")answers[x.id]={y:"yes",p:"partly",n:"no"}[c]})}
  return normLead({id:o.id||("L"+Date.now().toString(36)),submitted:o.t||Date.now(),company:profile.name||"Untitled",profile,answers,fw,path:o.h,intake:o.i||{},skipCheck:!!o.k,contact:o.c||{},status:"new",source:"code"});
}
function normLead(l){const a=norm({profile:l.profile,answers:l.answers,fw:l.fw,path:l.path,intake:l.intake});l.profile=a.profile;l.answers=a.answers;l.fw=a.fw;l.path=a.path;l.intake=a.intake;l.contact=l.contact||{};return l}

function temperature(l,pf){
  const p=l.profile;let s=0;
  s+={tender:3,reg:3,investor:2,internal:1}[p.driver]||0;
  s+={"3m":3,"6m":2,"12m":1,explore:0}[l.contact&&l.contact.timing]??1;
  if((SIZE_IX[p.size]??1)>=2)s++;
  if(pf.res.some(r=>isMust(r.level)))s++;
  if(pf.res.length>=3)s++;
  if(pf.readiness<50)s++;
  return s>=8?"Hot":s>=5?"Warm":"Cool";
}

function briefBody(l,pf){

  const sens=(p.data||[]).filter(d=>SENSITIVE.includes(d));
  const dataNames={pii:"customer personal data",nric:"NRIC numbers",card:"payment card data",health:"health data",children:"children's data",fin:"financial records"};
  const req=pf.res.filter(r=>isMust(r.level));
  const funds=[...new Set(pf.res.map(r=>r.f.fund).filter(Boolean))];
  const discovery=[
    `You said this is driven by ${DRIVER_TXT[p.driver]||"the business"}. Who is asking, and by when?`,

    ["Our IT vendor already handles this.","Certifications cover the management system: policies, risk decisions, supplier oversight and audits. A vendor runs tools but can't own those for the client."],
    ["We don't have time.",`We do the drafting. Client time is mainly workshops and evidence, about ${pf.clientDays} person-days across the programme.`],
    p.driver==="tender"?["The tender closes soon.","Narrow the first scope to the service in the tender, start with the quickest recognised mark, and confirm what evidence the buyer accepts in the meantime."]:null,

     <span class="meta">${esc(p.industry)} · ${esc(p.size)} staff · ${esc({private:"private company",sub:"part of a larger group",listed:"SGX-listed"}[p.status]||"")} · ${esc({cloud:"cloud only",hybrid:"cloud and own servers",onprem:"own server room"}[p.hosting]||"")}</span></div>
     <span class="pill T-${t} big">${t} lead</span></div>
   <section class="card"><h2>Contact</h2>

       <dt>Name</dt><dd>${esc(c.name||"Not given")}${c.role?`, ${esc(c.role)}`:""}</dd>
       <dt>Email</dt><dd class="sel">${esc(c.email||"—")}</dd>
       <dt>Phone</dt><dd class="sel">${esc(c.phone||"—")}</dd>
       <dt>Prefers</dt><dd>${esc(c.pref||"—")}</dd>
       <dt>Needs it</dt><dd>${esc(timing)}</dd>
       <dt>Driver</dt><dd>${esc(DRIVER_TXT[p.driver]||"—")}</dd>
       ${c.note?`<dt>Their note</dt><dd>"${esc(c.note)}"</dd>`:""}
     </dl></section>
   ${briefSituation(l,pf)}
   <div class="tiles">
     <div class="tile"><span class="v">${pf.readiness}%</span><span class="k">Self-assessed readiness</span></div>
     <div class="tile"><span class="v">${pf.res.length}</span><span class="k">Frameworks (${req.length} required or requested)</span></div>
     <div class="tile"><span class="v">~${pf.months}<span style="font-size:1rem;font-weight:600"> mo</span></span><span class="k">Programme length</span></div>
     <div class="tile lead"><span class="v">${range(pf.consult)}</span><span class="k">Consulting fees (${pf.days} days)</span></div>
   </div>

     <p class="meta" style="margin:0">As one programme: ${pf.days} days instead of ${pf.standalone}, saving about ${money(pf.saved*pf.rate,1000)} in fees. Quote the programme, not the sum.</p></section>

function briefSituation(l,pf){
  const it=l.intake||{},P=PATHS[l.path]||PATHS.full,rows=[];
  rows.push(["Came in through",`${P.name} route: "${P.title}"`]);
  if((it.goals||[]).length)rows.push(["Their goals",it.goals.map(g=>(GOALS.find(x=>x[0]===g)||[,g])[1]).join("; ")]);
  if(it.asker)rows.push(["Requested by",(ASKERS.find(x=>x[0]===it.asker)||[,it.asker])[1]]);
  if((it.asked||[]).length)rows.push(["They asked for",it.asked.map(id=>FW_BY_ID[id]?FW_BY_ID[id].short:id).join(", ")]);
  if(it.other)rows.push(["In the requester's words",`"${it.other}"`]);
  if(it.deadline)rows.push(["Deadline",(DEADLINES.find(x=>x[0]===it.deadline)||[,"—"])[1]]);
  if(it.conseq)rows.push(["If they miss it",(CONSEQ.find(x=>x[0]===it.conseq)||[,"—"])[1]]);
  if(it.budget)rows.push(["Budget",(BUDGETS.find(x=>x[0]===it.budget)||[,"—"])[1]]);
  if(it.lead)rows.push(["Internal lead",(LEADS.find(x=>x[0]===it.lead)||[,"—"])[1]]);
  const flags=situationFlags(l,pf);
  return `<section class="card"><h2>Their situation and expectations</h2>
   <dl class="kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
   ${flags.length?`<h3>Expectations to manage on the call</h3><dl class="obj">${flags.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:`<p class="meta" style="margin:0">No budget, deadline or ownership concerns flagged.</p>`}
   <p class="meta" style="margin:0">Set expectations early: what's included, what they pay auditors directly, internal time of about ${commitment(pf)} hours a week, and that certificates need months of records.</p></section>`;
}

/* ===================== Global events ===================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-step],[data-copy],[data-del],[data-del-yes],[data-del-no],[data-open],[data-desk],[data-lead],[data-back-report],[data-rtab],[data-lib],[data-path],[data-switch],[data-change-path],[data-back-assess]");if(!t)return;
  if(t.dataset.path){startPath(t.dataset.path);return}
  if(t.dataset.switch){if(step==="profile")readProfile();cur.path=t.dataset.switch;touch();step=PATHS[cur.path].steps[0][0];go("assess");return}
  if("changePath" in t.dataset){if(step==="profile")readProfile();if(["goals","request"].includes(step))readIntake();pathPick="switch";go("start");return}
  if("backAssess" in t.dataset){go("assess");return}
  if(t.dataset.nav){if(t.dataset.nav==="home"){pendingDelete=null}go(t.dataset.nav);return}
  if(t.dataset.step){setStep(t.dataset.step);return}
  if(t.dataset.rtab){setRepTab(t.dataset.rtab);return}
  if(t.dataset.lib){libTab=t.dataset.lib;renderLibrary();return}
  if(t.dataset.copy){e.stopPropagation();copyExample();return}
  if(t.dataset.del){pendingDelete=t.dataset.del;renderHome();return}
  if(t.dataset.delYes){const id=t.dataset.delYes;pendingDelete=null;if(cur&&cur.id===id)cur=null;removeItem(id);renderHome();return}
  if("delNo" in t.dataset){pendingDelete=null;renderHome();return}
  if(t.dataset.desk){deskTab=t.dataset.desk;renderDesk();return}
  if(t.dataset.lead){curLead=allLeads().find(x=>x.id===t.dataset.lead)||null;if(curLead)go("brief");return}
  if("backReport" in t.dataset){go("assess",{step:"report"});return}
  if(t.dataset.open&&!e.target.closest("[data-stop]"))openItem(t.dataset.open);
});
document.addEventListener("keydown",e=>{
  if(!(e.key==="Enter"||e.key===" ")||!e.target.matches)return;
  if(e.target.matches(".row[data-open]")){e.preventDefault();openItem(e.target.dataset.open)}
  else if(e.target.matches(".row[data-lead],tr[data-rtab]")){e.preventDefault();e.target.click()}
});
